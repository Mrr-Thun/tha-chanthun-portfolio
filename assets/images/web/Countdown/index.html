<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi Countdown with Looping Video</title>
  <style>
    body {
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #fff;
      font-family: 'Arial', sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      transition: background-image 0.5s ease-in-out;
    }
    
    /* Video Background Styles */
    #bgVideo {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      z-index: -1;
      object-fit: cover;
      display: none;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      z-index: 10;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    #countdown {
      display: flex;
      gap: 20px;
      font-size: 2em;
      margin-bottom: 30px;
      z-index: 10;
    }
    .time-box {
      background: rgba(0, 0, 0, 0.4);
      padding: 20px;
      border-radius: 10px;
      min-width: 100px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .label {
      font-size: 0.5em;
      margin-top: 10px;
      display: block;
      opacity: 0.8;
    }
    .buttons {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      z-index: 10;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      background: #ff9800;
      color: #fff;
      transition: background 0.3s, transform 0.1s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
    }
    button:hover {
      background: #e68900;
      transform: scale(1.05);
    }
    #customInput {
      margin-top: 20px;
      display: none;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 10px;
      backdrop-filter: blur(5px);
    }
    input {
      padding: 8px;
      border-radius: 5px;
      border: none;
      font-size: 1em;
      margin: 5px;
    }
    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      display: none;
    }
  </style>
</head>
<body>

  <video id="bgVideo" autoplay muted loop playsinline>
    <source src="" type="video/mp4">
  </video>

  <canvas id="fireworksCanvas"></canvas>

  <h1 id="title">🎆 Countdown 🎆</h1>
  
  <div id="countdown">
    <div class="time-box"><span id="days">0</span><span class="label">Days</span></div>
    <div class="time-box"><span id="hours">0</span><span class="label">Hours</span></div>
    <div class="time-box"><span id="minutes">0</span><span class="label">Minutes</span></div>
    <div class="time-box"><span id="seconds">0</span><span class="label">Seconds</span></div>
  </div>

  <div class="buttons">
    <button onclick="setChristmas()">Christmas 🎄</button>
    <button onclick="setNewYear()">New Year 🎆</button>
    <button onclick="setBirthday()">Birthday 🎂</button>
    <button onclick="setAnything()">Anything ✨</button>
  </div>

  <div id="customInput">
    <p id="inputLabel">Select date & time:</p>
    <input type="text" id="customName" placeholder="Enter Name (e.g. John)" style="display:none;">
    <input type="datetime-local" id="customDate">
    <br><br>
    <button onclick="applyCustom()">Start Countdown</button>
  </div>

  <script>
    let targetDate;
    let countdownInterval;
    let eventType = "generic"; 
    let targetName = "";
    let fireworksActive = false;
    let fireworksTimeout;

    // Helper function to manage background switching
    function setBackground(type, source) {
        const video = document.getElementById("bgVideo");
        
        if (type === 'video') {
            document.body.style.backgroundImage = "none";
            video.src = source;
            video.style.display = "block";
            video.loop = true; // FORCE LOOP in JavaScript
            video.play();
        } else {
            video.pause();
            video.style.display = "none";
            document.body.style.backgroundImage = `url('${source}')`;
        }
    }

    // --- FIREWORKS ENGINE ---
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createParticle(x, y) {
      const particleCount = 30;
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: x,
          y: y,
          color: `hsl(${Math.random() * 360}, 100%, 50%)`,
          radius: Math.random() * 3 + 1,
          velocity: {
            x: (Math.random() - 0.5) * 6,
            y: (Math.random() - 0.5) * 6
          },
          alpha: 1,
          decay: Math.random() * 0.015 + 0.005
        });
      }
    }

    function animateFireworks() {
      if (!fireworksActive && particles.length === 0) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }
      requestAnimationFrame(animateFireworks);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (fireworksActive && Math.random() < 0.05) {
        createParticle(Math.random() * canvas.width, Math.random() * canvas.height / 2);
      }

      particles.forEach((p, index) => {
        if (p.alpha <= 0) {
          particles.splice(index, 1);
        } else {
          p.velocity.y += 0.05;
          p.x += p.velocity.x;
          p.y += p.velocity.y;
          p.alpha -= p.decay;
          
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2, false);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      });
    }

    function startFireworks() {
      fireworksActive = true;
      document.getElementById('fireworksCanvas').style.display = 'block';
      animateFireworks();

      clearTimeout(fireworksTimeout);
      fireworksTimeout = setTimeout(() => {
        fireworksActive = false;
        setTimeout(() => {
            document.getElementById('fireworksCanvas').style.display = 'none';
        }, 3000); 
      }, 60000); 
    }

    // --- COUNTDOWN LOGIC ---
    function updateCountdown() {
      if (!targetDate) return;
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("days").textContent = 0;
        document.getElementById("hours").textContent = 0;
        document.getElementById("minutes").textContent = 0;
        document.getElementById("seconds").textContent = 0;

        if (eventType === "birthday" && targetName) {
            document.getElementById("title").textContent = `🎉 Happy Birthday, ${targetName}! 🎂`;
        } else if (eventType === "birthday") {
            document.getElementById("title").textContent = "🎉 Happy Birthday! 🎂";
        } else {
            document.getElementById("title").textContent = "🎉 Time's Up! 🎉";
        }

        if (!fireworksActive) startFireworks();
        clearInterval(countdownInterval);
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("seconds").textContent = seconds;
    }

    function resetTimer() {
        clearInterval(countdownInterval);
        fireworksActive = false;
        document.getElementById('fireworksCanvas').style.display = 'none';
        countdownInterval = setInterval(updateCountdown, 1000);
    }

    // --- BUTTON FUNCTIONS ---

    function setChristmas() {
      setBackground('image', 'pic/Christmas.jpg');
      
      eventType = "generic";
      const year = new Date().getFullYear();
      targetDate = new Date(`December 25, ${year} 00:00:00`);
      if (targetDate < new Date()) targetDate = new Date(`December 25, ${year+1} 00:00:00`);
      
      document.getElementById("title").textContent = "🎄 Countdown to Christmas 🎄";
      document.getElementById("customInput").style.display = "none";
      resetTimer();
      updateCountdown();
    }

    function setNewYear() {
      setBackground('image', 'pic/New Year.jpg');

      eventType = "generic";
      const year = new Date().getFullYear() + 1;
      targetDate = new Date(`January 1, ${year} 00:00:00`);
      
      document.getElementById("title").textContent = "🎆 Countdown to New Year 🎆";
      document.getElementById("customInput").style.display = "none";
      resetTimer();
      updateCountdown();
    }

    function setBirthday() {
      // Switch to Video Background
      setBackground('video', 'pic/Loon.mp4');

      eventType = "birthday";
      document.getElementById("title").textContent = "🎂 Birthday Setup 🎂";
      document.getElementById("customInput").style.display = "block";
      
      const nameInput = document.getElementById("customName");
      nameInput.style.display = "inline-block";
      nameInput.value = ""; 
      document.getElementById("inputLabel").textContent = "Enter Name & Date:";
    }

    function setAnything() {
      setBackground('image', 'pic/Outdoor.jpg');

      eventType = "generic";
      document.getElementById("title").textContent = "✨ Event Setup ✨";
      document.getElementById("customInput").style.display = "block";
      
      document.getElementById("customName").style.display = "none";
      document.getElementById("inputLabel").textContent = "Select date & time:";
    }

    function applyCustom() {
      const dateInput = document.getElementById("customDate").value;
      const nameInput = document.getElementById("customName").value;

      if (dateInput) {
        targetDate = new Date(dateInput);
        
        if (eventType === "birthday") {
            targetName = nameInput;
            const displayName = targetName ? targetName : "someone special";
            document.getElementById("title").textContent = `🎂 Countdown for ${displayName} 🎂`;
        } else {
            document.getElementById("title").textContent = "✨ Countdown to Your Event ✨";
        }
        
        resetTimer();
        updateCountdown();
        document.getElementById("customInput").style.display = "none";
        
      } else {
          alert("Please select a date first!");
      }
    }
  </script>
</body>
</html>
